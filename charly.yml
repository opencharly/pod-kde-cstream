              retry_interval: 2s
              command:
                command: KDE_SESSION_VERSION=6 kdotool getmouselocation
                in_container: true
              stdout:
                  - contains: "x:1913 y:1075"
            # The streaming gate: a window maps on the streamer's own compositor (the parent),
            # the stream must change, and the window goes away again. The input steps below
            # then prove the desktop got its keyboard and pointer back (a closing parent
            # window used to strand focus on it: opencharly/gst-wayland-display, toplevel_destroyed).
            - run: the streaming gate -- the stream changes when a client maps on the streamer's own compositor
              id: bed-stream-live
              context: [runtime]
              timeout: 180s
              command:
                command: /usr/local/bin/stream-probe
                in_container: true
              stdout:
                  - contains: STREAM-LIVE-OK
            - check: before any input, the marker the typed command creates does not exist
              id: bed-input-absent
              context: [runtime]
              file:
                file: /tmp/kde-cstream-input-ok
                exists: false
            # The input sequence is authored as the bed's own `check:` steps: a bed's
            # `run:` steps are verify-only in its check-live stage (skipped), so a
            # mutation the bed needs must live in a check step (/charly-check:check).
            - run: a Konsole is launched inside the Plasma session
              id: bed-open-konsole
              context: [runtime]
              command:
                command: |
                  WAYLAND_DISPLAY=wayland-kde XDG_RUNTIME_DIR=/tmp/cstream-rt setsid konsole >/dev/null 2>&1 < /dev/null &
                  echo launched
                in_container: true
              exit_status: 0
            # The sync primitive for "keystrokes will reach Konsole": KWin itself reports
            # Konsole as its ACTIVE window (kdotool, over KWin's D-Bus scripting), polled
            # under a bounded window -- no fixed delay.
            - check: KWin reports the Konsole as its active window, so input sent through the stream reaches it
              id: bed-konsole-focused
              context: [runtime]
              eventually: 60s
              retry_interval: 2s
              exit_status: 0
              stdout:
                  - contains: Konsole
              command:
                command: KDE_SESSION_VERSION=6 kdotool getactivewindow getwindowname
                in_container: true
            - run: a command is typed into the Konsole through the stream's control channel
              id: bed-stream-type
              context: [runtime]
              cstream:
                method: type
                text: touch /tmp/kde-cstream-input-ok
              stdout:
                  - contains: CSTREAM-INPUT-DELIVERED
            - run: Return is pressed through the stream
              id: bed-stream-return
              context: [runtime]
              cstream:
                method: key
                key: Return
              stdout:
                  - contains: CSTREAM-INPUT-DELIVERED
            - check: the command typed through the stream ran inside the pod (WebRTC -> webrtcsink -> waylanddisplaysrc -> KWin -> Konsole)
              id: bed-input-reached-plasma
              context: [runtime]
              eventually: 30s
              retry_interval: 2s
              file:
                file: /tmp/kde-cstream-input-ok
                exists: true
            - run: a pointer move sent through the stream lands where KWin puts its cursor
              id: bed-stream-pointer
              context: [runtime]
              cstream:
                method: move
                x: 700
                y: 400
              stdout:
                  - contains: CSTREAM-INPUT-DELIVERED
            - check: KWin's cursor is at the position the stream sent
              id: bed-pointer-reached-kwin
              context: [runtime]
              eventually: 20s
              retry_interval: 2s
              exit_status: 0
              stdout:
                  - contains: "x:700 y:400"
              command:
                command: KDE_SESSION_VERSION=6 kdotool getmouselocation
                in_container: true
            # The wheel (opencharly/gst-wayland-display#8), end to end at a real client: wev
            # logs Wayland's one-notch-down as `axis: 0 (vertical), value120: 120`. A wrong
            # sign gives -120, a wrong scale another number, a missing link nothing.
            - run: wev, the axis observer, starts as a client of the nested KWin
              id: bed-wheel-observer
              context: [runtime]
              command:
                command: |
                  WAYLAND_DISPLAY=wayland-kde XDG_RUNTIME_DIR=/tmp/cstream-rt setsid wev > /tmp/wev.log 2>&1 < /dev/null &
                  echo launched
                in_container: true
            - run: wev is placed at a known geometry, so the stream can point at it
              id: bed-wheel-observer-place
              context: [runtime]
              eventually: 60s
              retry_interval: 2s
              command:
                command: |
                  export KDE_SESSION_VERSION=6
                  w=$(kdotool search --class wev | head -1)
                  test -n "$w" || exit 1
                  kdotool windowmove "$w" 100 100
                  kdotool windowsize "$w" 600 400
                in_container: true
            - check: wev is at 100,100 and 600x400
              id: bed-wheel-observer-placed
              context: [runtime]
              eventually: 20s
              retry_interval: 2s
              command:
                command: KDE_SESSION_VERSION=6 kdotool getwindowgeometry $(KDE_SESSION_VERSION=6 kdotool search --class wev | head -1)
                in_container: true
              stdout:
                  - contains: "Position: 100,100"
                  - contains: "Geometry: 600x400"
            - run: the pointer moves onto wev through the stream
              id: bed-wheel-pointer-on-observer
              context: [runtime]
              cstream:
                method: move
                x: 400
                y: 300
              stdout:
                  - contains: CSTREAM-INPUT-DELIVERED
            - check: before any wheel input, wev has the pointer and has seen NO axis event
              id: bed-wheel-absent
              context: [runtime]
              eventually: 20s
              retry_interval: 2s
              command:
                command: grep -q 'wl_pointer\] enter' /tmp/wev.log && ! grep -q axis /tmp/wev.log
                in_container: true
            - run: one wheel notch down is sent through the stream (120 per notch, positive = up)
              id: bed-wheel-sent
              context: [runtime]
              cstream:
                method: scroll
                x: 400
                y: 300
                delta_x: 0
                delta_y: -120
              stdout:
                  - contains: CSTREAM-INPUT-DELIVERED
            - check: wev received exactly Wayland's one notch down -- the stream's wheel reached a KDE client with the right sign and size
              id: bed-wheel-reached-client
              context: [runtime]
              eventually: 20s
              retry_interval: 2s
              command:
                command: grep 'axis_value120' /tmp/wev.log
                in_container: true
              stdout:
                  - contains: "axis: 0 (vertical), value120: 120"

# Disposable R10 bed: a REAL browser (headless Google Chrome, a sibling member on the
# shared charly network) logs in to the gateway, plays the stream, and types into the
# desktop through the page -- the path a person uses, end to end.
#
# The subject pod plus a chrome sibling member, ordered by `stage:` (stage groups run in
# first-seen order; within a stage, steps on different members run concurrently,
# same-member steps keep authored order).
#
# THE ORDER LAW, which is why the marker-absence check below carries `stage: browser`:
# a stage group's POSITION is where its NAME is first seen in the walk, and the root node
# is walked before its members. A group named only in the chrome member (`browser` was)
# therefore lands AFTER every group the subject names -- so `verify` and the wheel groups
# ran while the page was still on its LOGIN FORM, and `browser-viewer-counted` read
# `"viewers":0` correctly and failed the bed (opencharly/charly-streamer#22). Naming the
# group in the root plan puts the browser phase where it belongs:
#   setup   -- the subject launches a Konsole while chrome opens the player
#   browser -- chrome logs in, plays and types through the page; the subject asserts its
#              marker is absent before that
#   verify  -- the subject asserts the gateway counted a viewer while it played, the
#              command the browser typed ran, and the gateway kept one pid
#   wheel-* -- the pointer and the axis round trip
check-kde-cstream-browser:
    pod:
        image: kde-cstream-check
        disposable: true
        lifecycle: dev
        description: >-
            Sole proof that a browser can use pod-kde-cstream: headless Chrome is refused
            the signalling socket without a session, is refused by PAM on a wrong password,
            logs in with the probe account, plays a live 1920x1080 H.264 stream whose
            decoded frame count keeps rising, shows the Plasma desktop, and types a command
            into a Konsole through the page that then runs inside the pod.
        add_candy:
            - '@github.com/opencharly/plugin-cstream/candy/plugin-cstream:v2026.325.1242'
            - '@github.com/opencharly/plugin-cdp/candy/plugin-cdp:v2026.314.1533'
        plan:
            - check: the gateway is ready, and the streamer reports the HARDWARE encoder it opened
              id: browser-gateway-ready
              stage: setup
              context: [runtime]
              eventually: 120s
              retry_interval: 5s
              cstream: status
              stdout:
                  - contains: '"ready":true'
                  - contains: '"encoder":"hardware:'
            - check: before any input, the marker the browser will create does not exist
              id: browser-input-absent
              # `browser`, not `setup`, and that is the FIX, not a label: this is the root
              # node's only browser-phase step, and naming the group here is what makes the
              # whole browser phase run BEFORE `verify` (see THE ORDER LAW above).
              stage: browser
              context: [runtime]
              file:
                file: /tmp/kde-cstream-browser-ok
                exists: false
            - run: a Konsole is launched inside the Plasma session
              id: browser-open-konsole
              stage: setup
              context: [runtime]
              command:
                command: |
                  WAYLAND_DISPLAY=wayland-kde XDG_RUNTIME_DIR=/tmp/cstream-rt setsid konsole >/dev/null 2>&1 < /dev/null &
                  echo launched
                in_container: true
              exit_status: 0
            - check: KWin reports the Konsole as its active window
              id: browser-konsole-focused
              stage: setup
              context: [runtime]
              eventually: 60s
              retry_interval: 2s
              exit_status: 0
              stdout:
                  - contains: Konsole
              command:
                command: KDE_SESSION_VERSION=6 kdotool getactivewindow getwindowname
                in_container: true
            # The gateway has its own uptime check; the STREAMER had none, and run
            # 2026.327.2201 caught it at `uptime 0:00:58` three minutes into the live phase —
            # a restart that kills the WebRTC session the wheel stages then rely on.
            # Measuring UPTIME was wrong: services are ordered by priority (dbus 2 →
            # pipewire 5 → broker 8 → streamer), so a young streamer at verify is the
            # SCHEDULE, not a restart (measured 2026-11-24; the earlier FATAL belonged to the
            # OLD pin d72b448, not to this tree). What matters is that it is not in a failed
            # state and that its own output carries no fatal.
            - check: the streamer is healthy at the end of the session -- RUNNING, and no fatal in its own log
              id: browser-streamer-health
              stage: verify
              context: [runtime]
              command:
                command: |
                  st=$(supervisorctl status cstream-streamer 2>&1 | tr -s ' ')
                  echo "status: $st"
                  echo "$st" | grep -q ' RUNNING ' || exit 1
                  if [ -f /tmp/cstream-streamer.out ]; then
                    n=$(grep -ciE 'fatal|panic' /tmp/cstream-streamer.out)
                    test "$n" -eq 0 || { echo "fatal lines in the streamer log: $n"; exit 1; }
                  fi
                  echo "streamer healthy"
              exit_status: 0
              stdout:
                  - contains: streamer healthy
            - check: the gateway stayed up for the whole session, so its in-memory session count is meaningful
              id: browser-gateway-uptime
              # The failure REASON carries supervisor's own uptime string, so a restart is
              # visible in the run log: a crash-looping gateway zeroes `viewers` silently.
              stage: verify
              context: [runtime]
              exit_status: 0
              command:
                command: supervisorctl status cstream-gateway
                in_container: true
              stdout:
                  - matches: 'RUNNING\s+pid [0-9]+, uptime [0-9]+:'
            - check: the gateway counts the browser as a viewer while it plays
              id: browser-viewer-counted
              # stage: verify runs on the SUBJECT pod's venue (the same venue as
              # browser-input-reached-plasma). In the browser stage the probe resolves
              # against the chrome member, which has no :8080 port mapping.
              stage: verify
              context: [runtime]
              eventually: 180s
              retry_interval: 3s
              cstream: status
              stdout:
                  - contains: '"viewers":1'
            - check: the browser's typing ran inside the pod (Chrome -> data channel -> webrtcsink -> waylanddisplaysrc -> KWin -> Konsole)
              id: browser-input-reached-plasma
              stage: verify
              context: [runtime]
              eventually: 60s
              retry_interval: 2s
              file:
                file: /tmp/kde-cstream-browser-ok
                exists: true
            # The wheel from a real browser: Chrome's own wheel event -> the player's
            # wheelDeltas -> the control channel -> waylanddisplaysrc -> KWin -> wev. wev
            # covers the desktop above the panel, so any point in the video's upper area
            # maps onto it whatever the viewport (the player scales and clamps), and the
            # absence step's `wl_pointer] enter` proves the pointer is really on it.
            - run: wev, the axis observer, starts as a client of the nested KWin
              id: browser-wheel-observer
              stage: wheel-observe
              context: [runtime]
              command:
                command: |
                  WAYLAND_DISPLAY=wayland-kde XDG_RUNTIME_DIR=/tmp/cstream-rt setsid wev > /tmp/wev-browser.log 2>&1 < /dev/null &
                  echo launched
                in_container: true
            - run: wev covers the desktop above the panel
              id: browser-wheel-observer-place
              stage: wheel-observe
              context: [runtime]
              eventually: 60s
              retry_interval: 2s
              command:
                command: |
                  export KDE_SESSION_VERSION=6
                  w=$(kdotool search --class wev | head -1)
                  test -n "$w" || exit 1
                  kdotool windowmove "$w" 0 0
                  kdotool windowsize "$w" 1920 1000
                in_container: true
            # Declarative: the streamer writes its own output (pod-cstream's service declares
            # `stdout:`), so a bed step only has to assert the file is there and non-empty.
            # No supervisorctl, no grep, no inline shell (opencharly/pod-kde-cstream#2).
            - check: the streamer wrote its own log, so a crash would have been recorded
              id: browser-streamer-log
              stage: verify
              context: [runtime]
              file:
                file: /tmp/cstream-streamer.out
                exists: true
            - check: the browser's pointer reached wev, and wev has seen NO axis event yet
              id: browser-wheel-absent
              stage: wheel-aim
              context: [runtime]
              eventually: 30s
              retry_interval: 2s
              command:
                command: grep -q 'wl_pointer\] enter' /tmp/wev-browser.log && ! grep -q axis /tmp/wev-browser.log
                in_container: true
            - check: wev received exactly Wayland's one notch down from the browser's wheel -- right sign, right size
              id: browser-wheel-reached-client
              stage: wheel-reached
              context: [runtime]
              eventually: 30s
              retry_interval: 2s
              command:
                command: grep 'axis_value120' /tmp/wev-browser.log
                in_container: true
              stdout:
                  - contains: "axis: 0 (vertical), value120: 120"
    kde-cstream-chrome:
        pod:
            image: fedora.chrome-headless
            plan:
                - check: the signalling socket refuses a browser with no session
                  id: browser-signalling-refused
                  stage: setup
                  context: [runtime]
                  eventually: 180s
                  retry_interval: 5s
                  exit_status: 0
                  stdout:
                      - contains: "401"
                  command:
                    command: curl -s -o /dev/null -w '%{http_code}' http://${HOST:check-kde-cstream-browser}:8080/signalling
                    in_container: true
                - run: Chrome opens the gateway's player
                  id: browser-open
                  stage: setup
                  context: [runtime]
                  eventually: 60s
                  retry_interval: 3s
                  cdp:
                    method: open
                    url: http://${HOST:check-kde-cstream-browser}:8080/
                - check: the player shows its login form
                  id: browser-login-form
                  stage: setup
                  context: [runtime]
                  timeout: 60s
                  cdp:
                    method: wait
                    tab: "1"
                    selector: "#login-form"
                - run: a wrong password is submitted through the form
                  id: browser-bad-password-typed
                  stage: browser
                  context: [runtime]
                  cdp:
                    method: eval
                    tab: "1"
                    expression: "document.getElementById('login-user').value='user'; document.getElementById('login-password').value='not-the-password'; document.getElementById('login-submit').click(); 'submitted'"
                  stdout:
                      - contains: submitted
                - check: PAM's refusal reaches the browser and no session starts
                  id: browser-bad-password-refused
                  stage: browser
                  context: [runtime]
                  eventually: 30s
                  retry_interval: 2s
                  cdp:
                    method: eval
                    tab: "1"
                    expression: "document.body.dataset.state + ' ' + document.getElementById('login-error').textContent"
                  stdout:
                      - contains: "login Login refused."
                - run: the probe account logs in through the form
                  id: browser-login
                  stage: browser
                  context: [runtime]
                  cdp:
                    method: eval
                    tab: "1"
                    expression: "document.getElementById('login-password').value='cstream-bed-pw'; document.getElementById('login-submit').click(); 'submitted'"
                  stdout:
                      - contains: submitted
                - check: the stream plays in the page at the desktop's full size
                  id: browser-playing
                  stage: browser
                  context: [runtime]
                  eventually: 90s
                  retry_interval: 3s
                  cdp:
                    method: eval
                    tab: "1"
                    expression: "document.body.dataset.state + ' ' + document.getElementById('screen').videoWidth + 'x' + document.getElementById('screen').videoHeight"
                  stdout:
                      - contains: "playing 1920x1080"
                - check: frames keep arriving -- the decoded frame count rises between two reads
                  id: browser-live-frames
                  stage: browser
                  context: [runtime]
                  eventually: 30s
                  retry_interval: 2s
                  cdp:
                    method: eval
                    tab: "1"
                    expression: "(async () => { const q = () => document.getElementById('screen').getVideoPlaybackQuality().totalVideoFrames; const a = q(); await new Promise(r => setTimeout(r, 1500)); const b = q(); return (b > a ? 'FRAMES-RISING ' : 'FRAMES-STUCK ') + a + '->' + b; })()"
                  stdout:
                      - contains: FRAMES-RISING
                - check: the page shows the desktop -- a non-uniform screenshot of the playing player
                  id: browser-screenshot
                  stage: browser
                  context: [runtime]
                  cdp:
                    method: screenshot
                    tab: "1"
                    artifact: /tmp/check-kde-cstream-browser.png
                    # NO byte floor beyond a truncated-write guard, and the reason is measured.
                    # A byte count measures COMPRESSIBILITY, not content: `Page.captureScreenshot`
                    # returns the 780x493 browser viewport, and the same correctly-captured desktop
                    # compressed to 11 354 bytes when it was a dark frame and 244 063 when it was a
                    # bright one (measured on the identical artifact path, 2026-11-24T08:19Z: 1 459
                    # distinct colours, 80.6% black). A 20 000-byte floor therefore failed a
                    # perfectly good capture and reported it as "the page shows no desktop".
                    # `artifact_not_uniform` is the assertion that actually measures "a desktop is
                    # there"; the byte count belongs in the diagnostic below, where it explains a
                    # failure instead of causing one.
                    artifact_not_uniform: true
                    artifact_min_bytes: 1000
                # When the screenshot assertion fails, its message says only "size N < min_bytes"
                # — it cannot say WHAT was captured. This check reports the shape so the next
                # run is self-explaining: the PNG's dimensions, its exact byte count and a hash.
                # Measured shape of a FAILING capture (2026-11-24T08:19Z): 780x493 — the BROWSER
                # VIEWPORT, not the 1920x1080 stream — with 1 459 distinct colours, so byte count
                # never characterised it and dimensions do. The hash tells whether two runs
                # captured the SAME frame or merely the same size.
                - agent-check: the browser screenshot shows the KDE Plasma desktop being streamed (wallpaper and panel), not a login form, a black frame or an error
                  stage: browser
                - run: the browser types the command into the desktop through the page
                  id: browser-type
                  stage: browser
                  context: [runtime]
                  cdp:
                    method: type
                    tab: "1"
                    selector: "#screen"
                    text: touch /tmp/kde-cstream-browser-ok
                - run: the browser presses Return through the page
                  id: browser-return
                  stage: browser
                  context: [runtime]
                  cdp:
                    method: raw
                    tab: "1"
                    http_method: Input.dispatchKeyEvent
                    params: '{"type":"keyDown","key":"Enter","code":"Enter","windowsVirtualKeyCode":13}'
                - run: the browser releases Return
                  id: browser-return-up
                  stage: browser
                  context: [runtime]
                  cdp:
                    method: raw
                    tab: "1"
                    http_method: Input.dispatchKeyEvent
                    params: '{"type":"keyUp","key":"Enter","code":"Enter","windowsVirtualKeyCode":13}'
                # THE POINTER-FOCUS TRANSITION (opencharly/charly-streamer#23). The
                # compositor resolves pointer focus once, at the toplevel map, and smithay
                # emits wl_pointer.enter ONLY on a focus TRANSITION — a client whose
                # wl_pointer attaches later never receives one. wev starts after the
                # toplevels map, so a move that stays inside its geometry produces no
                # enter. Park the pointer BELOW wev (which spans y=0..1000) first, so the
                # next move onto it IS a transition.
                # THE POINTER MOVES ARE DISPATCHED AS DOM EVENTS, not through `cdp: raw`.
                # Measured (opencharly/plugin-cdp#13): `raw` + Input.dispatchMouseEvent produces NO
                # page mousemove at all -- an instrumented element counted zero mouse events from
                # these steps across a whole session, while 68 key events from `cdp: type` arrived
                # through the same channel. A DOM MouseEvent on the video goes through the SAME page
                # listener the browser's real pointer would, so the chain under test is unchanged;
                # only the way the event is delivered is. When plugin-cdp#13 is fixed, these can go
                # back to `raw`.
                - run: the browser parks its pointer below the observer, so the next move crosses onto it
                  id: browser-wheel-park
                  stage: wheel-aim
                  context: [runtime]
                  cdp:
                    method: eval
                    tab: "1"
                    expression: "(() => { const v=document.getElementById('screen'); v.dispatchEvent(new MouseEvent('mousemove',{clientX:200,clientY:1050,bubbles:true})); return 'PARKED'; })()"
                  stdout:
                      - contains: PARKED
                - run: the browser moves its real mouse over the stream's upper area
                  id: browser-wheel-aim
                  stage: wheel-aim
                  context: [runtime]
                  cdp:
                    method: eval
                    tab: "1"
                    expression: "(() => { const v=document.getElementById('screen'); v.dispatchEvent(new MouseEvent('mousemove',{clientX:200,clientY:200,bubbles:true})); return 'AIMED'; })()"
                  stdout:
                      - contains: AIMED
                - run: the browser turns its real wheel one notch down (a DOM deltaY of 100 px)
                  id: browser-wheel-send
                  stage: wheel-reached
                  context: [runtime]
                  # A DOM WheelEvent, for the same reason as the park/aim moves above
                  # (opencharly/plugin-cdp#13): `raw` delivers no page event. deltaMode 0 = pixels,
                  # and 100 px is one notch in Chromium -- exactly what the old `deltaY: 100` meant.
                  cdp:
                    method: eval
                    tab: "1"
                    expression: "(() => { const v=document.getElementById('screen'); v.dispatchEvent(new WheelEvent('wheel',{clientX:200,clientY:200,deltaX:0,deltaY:100,deltaMode:0,bubbles:true,cancelable:true})); return 'WHEEL-SENT'; })()"
                  stdout:
                      - contains: WHEEL-SENT

kde-cstream-skill:
    skill:
        name: kde-cstream
        family: selkies
        owner: kde-cstream-session
        description: |-
            The pod-kde-cstream GPU pod: a fullscreen, hardware-accelerated KDE Plasma desktop streamed to a browser over cstream/WebRTC (:8080), on the CDI pod base.
            MUST be invoked before building, deploying, configuring or troubleshooting the kde-cstream image, its kde-cstream-session candy, or the check-kde-cstream-pod / check-kde-cstream-browser beds.
        triggers:
            - pod-kde-cstream
            - kde-cstream
            - check-kde-cstream-pod
            - check-kde-cstream-browser
            - KDE Plasma streamed over cstream
            - cstream desktop in a browser
