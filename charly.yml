#  opencharly/pod-kde-cstream — a fullscreen, GPU-accelerated KDE Plasma desktop streamed
#  to a browser over cstream (WebRTC), on the CDI pod base.
#
#    cstream-streamer (pod-cstream) ── IS the Wayland parent (waylanddisplaysrc, wayland-1)
#        ├─ KWin (pod-kde-nested, --socket wayland-kde) configured at the full output size
#        │     └─ plasmashell + KDE applications
#        └─ NVENC (nvidia) or VA-API (amdgpu/intel) encode -> webrtcsink
#    cstream-gateway :8080 ── the browser player, PAM login, authenticated signalling
#
#  The GPU reaches the image from the HOST through CDI (pod-cdi composes layer-cdi and never
#  bakes a driver): KWin composites with OpenGL ES on it, and the streamer encodes on it --
#  NVENC through the CDI-injected libcuda/libnvidia-encode on an NVIDIA node, VA-API on an
#  AMD/Intel node. The render node is charly's DRINODE unless the deployment sets
#  CSTREAM_RENDER_NODE.

import:
    # A builder map does NOT cross a namespace boundary: a box composed here declares its
    # own (kdotool, via layer-kde-shell, is an AUR package). Same pins as pod-kde-vnc.
    - arch: '@github.com/opencharly/distro-arch:v2026.326.1455'
    - podcdi: '@github.com/opencharly/pod-cdi:v2026.326.1530'
    # The headless Chrome DRIVER box the browser bed's chrome member runs.
    - fedora: '@github.com/opencharly/distro-fedora:v2026.325.1900'

kde-cstream-session:
    candy:
        description: |
            KDE Plasma as the cstream desktop: composes the cstream server (pod-cstream --
            the streamer that IS the Wayland parent, the gateway, PAM, audio) and the nested
            Plasma session (pod-kde-nested), and points the nested KWin at the streamer's
            own compositor: host socket wayland-1 in the streamer's runtime dir
            /tmp/cstream-rt, KWin serving wayland-kde, Plasma on the pod's shared session
            bus. No sway and no kiosk rule: the streamer's compositor configures its one
            toplevel at the full output size, so KWin is fullscreen by construction. Every
            claim is observable at runtime: the streamer, gateway and Plasma services
            RUNNING, KWin's single output at the stream's size, and Plasma's shell on the
            bus.
        # COMPOSITION, not `require:`: the transport and the desktop are what this candy
        # IS, so they are `candy:` members (the metalayer form); a require-only candy has
        # nothing of its own to install and charly rejects it.
        candy:
            - '@github.com/opencharly/pod-cstream:v2026.314.0717'
            - '@github.com/opencharly/pod-kde-nested:v2026.326.2127'
        require:
            # plugin-cstream serves the `cstream:` verb, plugin-dbus the `dbus:` verb this
            # pod's checks author.
            - '@github.com/opencharly/plugin-cstream/candy/plugin-cstream:v2026.325.1242'
            - '@github.com/opencharly/plugin-dbus/candy/plugin-dbus:v2026.314.0712'
        env:
            KDE_NESTED_HOST_DISPLAY: wayland-1
            KDE_NESTED_RUNTIME_DIR: /tmp/cstream-rt
            KDE_NESTED_SOCKET: wayland-kde
            KDE_NESTED_BUS: session
        plan:
            - check: the streamer, the gateway and the nested Plasma session are all RUNNING
              id: kde-cstream-services
              context: [runtime]
              eventually: 90s
              retry_interval: 3s
              exit_status: 0
              stdout:
                  - equals: RUNNING
              command:
                command: supervisorctl status cstream-streamer cstream-gateway kde-nested | awk '{print $2}' | sort -u
                in_container: true
            - check: Plasma's shell is on the session bus the deployment shares
              id: kde-cstream-plasmashell-on-bus
              context: [runtime]
              eventually: 90s
              retry_interval: 3s
              dbus: list
              stdout:
                  - contains: org.kde.plasmashell

kde-cstream:
    candy:
        description: |
            The pod-kde-cstream image: a fullscreen, GPU-accelerated KDE Plasma desktop
            streamed to a browser over cstream/WebRTC on :8080, built on the CDI GPU pod
            base (opencharly/pod-cdi), so the GPU driver comes from the host and none is
            baked in.
        base: podcdi.pod-cdi
        platform:
            - linux/amd64
        build:
            - pac
        builder:
            aur: arch.arch-builder
            cargo: arch.arch-builder
            npm: arch.arch-builder
            pixi: arch.arch-builder
        candy:
            - kde-cstream-session
        plan:
            - check: no host-side nvidia-ctk is baked into the image (the CDI pod contract)
              id: kde-cstream-no-nvidia-ctk
              exit_status: 0
              command: "! command -v nvidia-ctk"
            - check: the stream's input client and the browser player ship in the image
              id: kde-cstream-input-client
              exit_status: 0
              command: test -x /usr/local/bin/cstream-input && test -x /usr/local/bin/cstream-gateway && echo CLIENTS-OK
              stdout:
                  - contains: CLIENTS-OK

# The image the beds deploy: kde-cstream plus BED-ONLY fixtures, never shipped -- the
# probe account's password is in the clear by design, and the verb's venue probes are
# test tooling.
kde-cstream-check:
    candy:
        description: |
            Bed-only image: kde-cstream plus the cstream: verb's venue probes and a probe
            account with a known password. Deployed only by this repo's disposable beds.
        base: kde-cstream
        platform:
            - linux/amd64
        build:
            - pac
        candy:
            - '@github.com/opencharly/plugin-cstream/candy/cstream-probes:v2026.325.1242'
            - '@github.com/opencharly/plugin-cstream/candy/cstream-probe-account:v2026.325.1242'
            - kde-cstream-wheel-observer

# wev: the Wayland client that observes what a pointer axis event delivers, so the
# wheel is asserted at a real client, not at an intermediate layer. Bed-only.
kde-cstream-wheel-observer:
    candy:
        description: |
            BED FIXTURE ONLY: wev, the Wayland event viewer, as the client the beds'
            wheel steps observe. It logs every wl_pointer.axis it receives with its
            direction and its v120 value, which is the evidence that a wheel sent
            through the stream reached a KDE client with the right sign and size.
        package:
            - wev
        plan:
            - check: wev, the beds' axis observer, is installed
              id: wheel-observer-installed
              file:
                file: /usr/bin/wev
                exists: true

# Disposable R10 bed: builds the stack, deploys it, and proves the whole chain on the
# pod -- the stream serves, KWin is nested fullscreen and renders on the GPU, the
# streamer encodes in hardware, frames pulled back through WebRTC show Plasma, PAM
# refuses a wrong password, and input sent through the stream reaches a Plasma app.
check-kde-cstream-pod:
    pod:
        image: kde-cstream-check
        disposable: true
        lifecycle: dev
        description: >-
            Sole proof that pod-kde-cstream serves a fullscreen, hardware-accelerated KDE
            Plasma desktop over cstream: the streamer, gateway and Plasma services run; KWin
            nests in the streamer's compositor at the full output size and composites with
            OpenGL on the GPU (not llvmpipe); the streamer reports a hardware encoder; a
            frame decoded through the WebRTC track shows the desktop and changes when a
            window maps; PAM accepts the probe account and refuses a wrong password; and
            keys sent through the stream's control channel run a command in a Konsole.
        add_candy:
            # The verbs the steps below author. Pinned so the host check runner can reach
            # each plugin's manifest (the scalar `cstream: status` sugar is read from it).
            - '@github.com/opencharly/plugin-cstream/candy/plugin-cstream:v2026.325.1242'
            - '@github.com/opencharly/plugin-dbus/candy/plugin-dbus:v2026.314.0712'
        plan:
            - check: the gateway is ready, and the streamer reports the HARDWARE encoder it opened
              id: bed-gateway-ready-hardware
              context: [runtime]
              eventually: 120s
              retry_interval: 5s
              cstream: status
              stdout:
                  - contains: '"ready":true'
                  - contains: '"encoder":"hardware:'
            - check: KWin composites with hardware OpenGL, not the llvmpipe software rasterizer
              id: bed-kwin-gpu
              context: [runtime]
              eventually: 90s
              retry_interval: 3s
              dbus:
                method: call
                dest: org.kde.KWin
                path: /KWin
                member: org.kde.KWin.supportInformation
              stdout:
                  - contains: "Compositing Type: OpenGL"
                  - matches: "OpenGL renderer string: (NVIDIA|AMD|Intel|Radeon)"
                  - not_contains: llvmpipe
            - check: KWin's one output is the stream's full 1920x1080 -- Plasma is fullscreen in the stream
              id: bed-kwin-fullscreen
              context: [runtime]
              eventually: 60s
              retry_interval: 3s
              dbus:
                method: call
                dest: org.kde.KWin
                path: /KWin
                member: org.kde.KWin.supportInformation
              stdout:
                  - contains: "Geometry: 0,0,1920x1080"
            - check: a frame pulled back THROUGH the WebRTC track is a full, non-uniform 1920x1080 picture of the desktop
              id: bed-stream-frame
              context: [runtime]
              eventually: 90s
              retry_interval: 10s
              cstream:
                method: frame
                artifact: /tmp/check-kde-cstream-pod-frame.jpg
                artifact_min_dimensions: 1920x1080
                artifact_not_uniform: true
            - agent-check: the frame decoded from the stream shows a fullscreen KDE Plasma desktop (wallpaper and the panel along the bottom), not a black, gray or letterboxed frame
            - check: PAM accepts the probe account through the real session leader
              id: bed-login-accept
              context: [runtime]
              cstream:
                method: login
                user: user
                password: cstream-bed-pw
                expect: accept
              stdout:
                  - contains: LOGIN-ACCEPTED
            - check: PAM refuses a wrong password for the same account
              id: bed-login-reject
              context: [runtime]
              cstream:
                method: login
                user: user
                password: not-the-password
                expect: reject
              stdout:
                  - contains: LOGIN-REJECTED
            # The desktop at every size, live (the operator's requirement: it must work at
            # all resolutions and resize on the fly). Each size: the exact size applies (sizes
            # are fitted only to the encoder's own limits and to even dimensions), the
            # stream's frames carry it, KWin's output follows it, and a pointer move lands on
            # the exact pixel -- the FIRST move after the resize, which also proves the
            # pointer is not lost on a refocus. Portrait, 4K, a non-multiple-of-8 and a
            # 1366-wide size are all real browser windows. It ends back at 1920x1080.
            - run: resize the stream to 1366x768
              id: bed-size-1366x768
              context: [runtime]
              # The control socket refuses a second resize within 500 ms; the bound keeps a
              # dead socket failing.
              eventually: 15s
              retry_interval: 1s
              command:
                command: printf 'resize 1366 768\n' | timeout 10 socat - UNIX-CONNECT:/tmp/cstream-control.sock
                in_container: true
              stdout:
                  - contains: "OK resize 1366x768"
            - check: the stream's frames are 1366x768
              id: bed-size-1366x768-frames
              context: [runtime]
              eventually: 30s
              retry_interval: 2s
              command:
                command: |
                  f=$(ls -t /tmp/cstream-frames/*.jpg 2>/dev/null | head -1)
                  test -n "$f" || exit 1
                  gst-discoverer-1.0 "$f" | tr -s ' ' | grep -E 'Width|Height'
                in_container: true
              stdout:
                  - contains: "Width: 1366"
                  - contains: "Height: 768"
            - check: KWin's output followed the stream to 1366x768
              id: bed-size-1366x768-kwin
              context: [runtime]
              eventually: 30s
              retry_interval: 2s
              dbus:
                method: call
                dest: org.kde.KWin
                path: /KWin
                member: org.kde.KWin.supportInformation
              stdout:
                  - contains: "Geometry: 0,0,1366x768"
            - run: the pointer moves to the far corner of the 1366x768 desktop through the stream
              id: bed-size-1366x768-pointer
              context: [runtime]
              cstream:
                method: move
                x: 1359
                y: 763
              stdout:
                  - contains: CSTREAM-INPUT-DELIVERED
            - check: KWin's pointer is on that exact pixel of the 1366x768 desktop
              id: bed-size-1366x768-pointer-landed
              context: [runtime]
              eventually: 20s
              retry_interval: 2s
              command:
                command: KDE_SESSION_VERSION=6 kdotool getmouselocation
                in_container: true
              stdout:
                  - contains: "x:1359 y:763"
            - run: resize the stream to 390x844
